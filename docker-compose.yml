services:
  backend:
    build:
      context: ./backend
      dockerfile: ./backend/Dockerfile
    restart: always
    ports:
      - "3500:3500"

  nginx:
    image: nginx:latest
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./certbot/conf:/etc/letsencrypt:ro
      - ./certbot/www:/var/www/certbot:ro
    restart: always
    depends_on:
      - frontend

  frontend:
    build:
      context: ./frontend
      dockerfile: ./frontend/Dockerfile
    restart: always
    ports:
      - "3000:3000"
    depends_on:
      - backend